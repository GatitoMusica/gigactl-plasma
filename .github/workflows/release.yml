name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\([0-9.]*\).*$/\1/p' CMakeLists.txt | head -n 1)
          if [ -z "$VERSION" ] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match project version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deb:
    needs: verify-tag
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake dpkg-dev extra-cmake-modules file \
            libplasma-dev qt6-base-dev qt6-declarative-dev
      - name: Build Debian package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
          cpack --config build/CPackConfig.cmake -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: gigactl-plasma-deb
          path: build/packages/*.deb
          if-no-files-found: error

  rpm:
    needs: verify-tag
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y cmake extra-cmake-modules gcc-c++ \
            kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kirigami-devel \
            kf6-kwindowsystem-devel libplasma-devel rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel
      - name: Build RPM package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
          cpack --config build/CPackConfig.cmake -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: gigactl-plasma-rpm
          path: build/packages/*.rpm
          if-no-files-found: error

  arch:
    needs: verify-tag
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules git plasma-workspace qt6-base qt6-declarative shadow util-linux
      - name: Build Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -c 'cd "$GITHUB_WORKSPACE" && makepkg --nodeps --noconfirm --cleanbuild'
          mkdir -p dist
          cp ./*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gigactl-plasma-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs: [verify-tag, deb, rpm, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/gigactl-plasma-deb/*.deb \
              dist/gigactl-plasma-rpm/*.rpm \
              dist/gigactl-plasma-arch/*.pkg.tar.zst --clobber
          else
            gh release create "$TAG" --title "GigaControl Plasma $VERSION" \
              --notes-file CHANGELOG.md \
              dist/gigactl-plasma-deb/*.deb \
              dist/gigactl-plasma-rpm/*.rpm \
              dist/gigactl-plasma-arch/*.pkg.tar.zst
          fi
